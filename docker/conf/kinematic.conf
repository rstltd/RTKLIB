# RTKLIB option preset: kinematic
# Served by the solve service; GET /presets/kinematic returns this file.

pos1-posmode       =kinematic
pos1-frequency     =l1+l2
pos1-soltype       =forward    # (0:forward,1:backward,2:combined)
pos1-elmask        =15         # (deg)
pos1-snrmask_r     =off
pos1-snrmask_b     =off
pos1-dynamics      =on
pos1-tidecorr      =off
pos1-ionoopt       =brdc
pos1-tropopt       =saas
pos1-sateph        =brdc
pos1-navsys        =45         # gps+glo+gal+bds (1+4+8+32)

pos2-armode        =continuous
pos2-gloarmode     =fix-and-hold
pos2-bdsarmode     =off
pos2-arthres       =3
pos2-arlockcnt     =0
pos2-arelmask      =0
pos2-arminfix      =10
pos2-elmaskhold    =0
pos2-aroutcnt      =5
pos2-maxage        =30
pos2-slipthres     =0.05
pos2-rejionno      =30
pos2-niter         =1

out-solformat      =llh        # (0:llh,1:xyz,2:enu,3:nmea)
out-outhead        =on
out-outopt         =off
out-timesys        =gpst
out-timeform       =tow
out-timendec       =3
out-degform        =deg
out-fieldsep       =
out-height         =ellipsoidal
out-solstatic      =all
out-outstat        =residual

stats-eratio1      =300
stats-eratio2      =300
stats-errphase     =0.003
stats-errphaseel   =0.003
stats-errphasebl   =0
stats-errdoppler   =1
stats-stdbias      =30
stats-stdiono      =0.03
stats-stdtrop      =0.3
stats-prnaccelh    =3
stats-prnaccelv    =1
stats-prnbias      =0.0001
stats-prniono      =0.001
stats-prntrop      =0.0001
stats-clkstab      =5e-12

ant1-postype       =rinexhead  # from the RINEX header
ant2-postype       =rinexhead  # from the RINEX header
