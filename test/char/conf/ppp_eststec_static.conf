# PPP static, uncombined (est-stec) — exercises model_iono EST branch + udiono_ppp
# + per-sat slant-iono state in ppp_res (the seam PPP-RTK atmosphere ingestion changes).
# Broadcast ephemeris (no precise/OSB deps); float PPP, Q=6.
pos1-posmode   =ppp-static
pos1-frequency =l1+l2
pos1-elmask    =10
pos1-ionoopt   =est-stec
pos1-tropopt   =est-ztd
pos1-sateph    =brdc
pos1-navsys    =1
pos2-armode    =off
out-solformat  =llh
out-outhead    =on
