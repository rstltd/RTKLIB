# PPP static, est-stec + est-ztdgrad — additionally exercises udtrop_ppp gradient
# states and model_trop (the tropo seam of PPP-RTK atmosphere ingestion).
pos1-posmode   =ppp-static
pos1-frequency =l1+l2
pos1-elmask    =10
pos1-ionoopt   =est-stec
pos1-tropopt   =est-ztdgrad
pos1-sateph    =brdc
pos1-navsys    =1
pos2-armode    =off
out-solformat  =llh
out-outhead    =on
