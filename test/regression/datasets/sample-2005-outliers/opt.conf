# rnx2rtkp options for the sample-2005-static regression dataset.
#
# Chosen to exercise as much of the EKF path as possible rather than to be
# optimal: static mode with continuous ambiguity resolution keeps ddres(),
# manage_amb_LAMBDA() and lambda() on the hot path for every epoch.
#
# Do not edit without regenerating the baselines -- the options ARE part of
# what the baseline pins.

pos1-posmode       =static     # (0:single,1:dgps,2:kinematic,3:static,...)
pos1-frequency     =l1+l2      # data is GPS L1/L2 (L1 C1 L2 P2)
pos1-soltype       =forward    # (0:forward,1:backward,2:combined)
pos1-elmask        =15         # (deg)
pos1-snrmask_r     =off
pos1-snrmask_b     =off
pos1-dynamics      =off        # static station
pos1-tidecorr      =off
pos1-ionoopt       =brdc       # broadcast model; no external products needed
pos1-tropopt       =saas
pos1-sateph        =brdc       # broadcast ephemeris only, so the dataset is
                               # self-contained and never needs downloads
pos1-navsys        =1          # GPS only (this is 2005 data)

pos2-armode        =continuous # keeps LAMBDA on the hot path every epoch
pos2-gloarmode     =off        # no GLONASS in this dataset
pos2-bdsarmode     =off
pos2-arthres       =3
pos2-arlockcnt     =0
pos2-arelmask      =0
pos2-arminfix      =10
pos2-elmaskhold    =0
pos2-aroutcnt      =5
pos2-maxage        =30
pos2-slipthres     =0.05
pos2-rejionno      =0.05       # tight: forces outlier rejections
pos2-niter         =1

out-solformat      =llh        # (0:llh,1:xyz,2:enu,3:nmea)
out-outhead        =on
out-outopt         =off
out-timesys        =gpst
out-timeform       =tow
out-timendec       =3
out-degform        =deg
out-fieldsep       =
out-height         =ellipsoidal
out-solstatic      =all        # emit every epoch, not a single averaged fix
out-outstat        =residual   # the .stat detail this gate compares

stats-eratio1      =300
stats-eratio2      =300
stats-errphase     =0.003
stats-errphaseel   =0.003
stats-errphasebl   =0
stats-errdoppler   =1
stats-stdbias      =30
stats-stdiono      =0.03
stats-stdtrop      =0.3
stats-prnaccelh    =3
stats-prnaccelv    =1
stats-prnbias      =0.0001
stats-prniono      =0.001
stats-prntrop      =0.0001
stats-clkstab      =5e-12

ant1-postype       =rinexhead  # take the rover a priori position from RINEX
ant2-postype       =rinexhead  # take the base position from RINEX
