# Regression dataset: short-baseline static RTK, GPS L1/L2.
#
# The only dataset that ships inside the repository.  It is small (1 h, 30 s
# interval, 120 epochs) and resolves ambiguities on nearly every epoch, which
# makes it a fast and unusually sensitive guard: a change anywhere in zdres(),
# ddres(), the ambiguity resolution, or the error model moves the .stat file.
#
# It is NOT a substitute for the P1.1 datasets.  plan.md 11.1 asks for at least
# five 24 h sets from real monitoring stations covering open sky, obstructed
# sky, vegetated slope, urban multipath and long baseline.  Those are far too
# large for git; add them as sibling directories here with their files under
# $FGO_DATA_ROOT.  See README.md.

name        = sample-2005-static
description = 3.3 km static RTK, GPS L1/L2, 1 h @ 30 s (in-repo sample)

rover       = ${RTKLIB_ROOT}/test/data/rinex/07590920.05o
base        = ${RTKLIB_ROOT}/test/data/rinex/30400920.05o
nav         = ${RTKLIB_ROOT}/test/data/rinex/30400920.05n

opts        = opt.conf
args        =
